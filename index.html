<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index Compétitif Tier X (World of Tanks)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070f; --bg2: #0a0e1a; --panel: rgba(16,22,38,.82); --panel2: rgba(28,36,56,.7);
    --line: rgba(120,170,255,.16); --txt: #dfe7ff; --muted: #7e8cb2;
    --gold: #ffcf3f; --cyan: #33e6ff; --red: #ff5d6c; --green: #38ffb0; --violet: #9b7bff;
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: #2a3a63 transparent; }
  body {
    margin: 0; color: var(--txt); min-height: 100vh; overflow-x: hidden;
    font-family: "Rajdhani", system-ui, sans-serif; font-size: 16px; font-weight: 500;
    background:
      radial-gradient(1100px 620px at 50% -12%, rgba(51,230,255,.12), transparent 60%),
      radial-gradient(900px 600px at 88% 6%, rgba(255,207,63,.10), transparent 55%),
      radial-gradient(1000px 700px at 8% 100%, rgba(155,123,255,.10), transparent 55%),
      var(--bg);
  }
  /* Couche 1 : grille tech + points, animée */
  body::before {
    content: ""; position: fixed; inset: -20%; z-index: -2; pointer-events: none;
    background-image:
      linear-gradient(rgba(120,170,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,170,255,.06) 1px, transparent 1px),
      radial-gradient(rgba(120,170,255,.10) 1px, transparent 1.5px);
    background-size: 48px 48px, 48px 48px, 48px 48px;
    background-position: 0 0, 0 0, 24px 24px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 20%, #000 55%, transparent 92%);
    animation: drift 50s linear infinite;
  }
  @keyframes drift { from { background-position: 0 0, 0 0, 24px 24px; }
                     to { background-position: 48px 96px, 96px 48px, 72px 120px; } }
  /* Couche 2 : orbes lumineux qui dérivent lentement */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -3; pointer-events: none; overflow: hidden;
    background:
      radial-gradient(420px 420px at 18% 30%, rgba(51,230,255,.10), transparent 70%),
      radial-gradient(360px 360px at 82% 68%, rgba(255,207,63,.09), transparent 70%),
      radial-gradient(300px 300px at 60% 12%, rgba(155,123,255,.09), transparent 70%);
    animation: float 26s ease-in-out infinite alternate;
  }
  @keyframes float {
    from { transform: translate3d(0,0,0) scale(1); }
    to { transform: translate3d(-3%, 4%, 0) scale(1.08); }
  }
  /* Couche 3 : effets (silhouette char en filigrane + balayage + scanlines) */
  #fx { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
    background: repeating-linear-gradient(0deg, rgba(160,190,255,.014) 0 1px, transparent 1px 3px); }
  #fx::before {
    content: ""; position: absolute; right: -3%; bottom: -10%; width: 640px; height: 640px;
    background: url('https://api.worldoftanks.eu/static/2.77.0/wot/encyclopedia/vehicle/germany-G42_Maus.png') no-repeat center / contain;
    filter: grayscale(1) brightness(1.6); opacity: .06; transform: scaleX(-1);
  }
  #fx::after {
    content: ""; position: absolute; top: -50%; left: 0; width: 45%; height: 200%;
    background: linear-gradient(90deg, transparent, rgba(51,230,255,.07), transparent);
    transform: rotate(16deg); animation: sweep 16s linear infinite;
  }
  @keyframes sweep {
    0% { transform: translateX(-120%) rotate(16deg); }
    100% { transform: translateX(320%) rotate(16deg); }
  }
  a { color: var(--gold); text-decoration: none; }

  header { padding: 34px 20px 8px; text-align: center; position: relative; }
  header h1 {
    margin: 0; font-family: "Orbitron", sans-serif; font-weight: 900; font-size: 30px;
    letter-spacing: 3px; text-transform: uppercase; line-height: 1.1;
    background: linear-gradient(90deg, var(--gold), #fff 45%, var(--cyan));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 18px rgba(51,230,255,.35));
  }
  header h1 b { font-weight: 900; }
  header h1::after {
    content: ""; display: block; width: 220px; height: 2px; margin: 12px auto 0;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--gold), transparent);
    box-shadow: 0 0 14px rgba(51,230,255,.6);
  }
  header .sub { color: var(--muted); font-size: 14px; margin-top: 12px; letter-spacing: .5px; }
  header .by { color: var(--muted); font-size: 13px; margin-top: 3px; letter-spacing: 1px; text-transform: uppercase; }
  header .by b { color: var(--gold); font-family: "Orbitron", sans-serif; }
  .stats { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 16px; }
  .stat { text-align: center; }
  .stat b { display: block; font-family: "Orbitron", sans-serif; font-size: 26px; font-weight: 900;
    line-height: 1; background: linear-gradient(180deg, #fff, var(--cyan));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(51,230,255,.35)); }
  .stat span { display: block; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); margin-top: 4px; }
  .statsep { width: 1px; height: 30px; background: linear-gradient(180deg, transparent, var(--line), transparent); }

  .toolbar { max-width: 1240px; margin: 20px auto 0; padding: 0 16px;
    display: flex; flex-direction: column; gap: 14px; }
  .search {
    width: 100%; background: var(--panel); backdrop-filter: blur(8px);
    border: 1px solid var(--line); color: var(--txt); border-radius: 12px;
    padding: 14px 16px; font-family: "Rajdhani", sans-serif; font-size: 17px; font-weight: 600;
    letter-spacing: .5px; transition: .18s;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus { outline: none; border-color: var(--cyan);
    box-shadow: 0 0 0 1px var(--cyan), 0 0 24px rgba(51,230,255,.25); }
  .filters { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .filters .grp { display: flex; flex-wrap: wrap; gap: 7px; }
  .pill {
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 6px 13px; font-size: 12px; font-weight: 700; cursor: pointer;
    user-select: none; transition: .14s; white-space: nowrap; text-transform: uppercase; letter-spacing: .6px;
  }
  .pill:hover { border-color: var(--cyan); color: var(--txt); box-shadow: 0 0 12px rgba(51,230,255,.2); }
  .pill.on { background: linear-gradient(135deg, var(--gold), #ffe38a); border-color: var(--gold);
    color: #17140a; box-shadow: 0 0 18px rgba(255,207,63,.4); }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .count { color: var(--cyan); font-size: 12px; margin-left: auto; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; font-family: "Orbitron", sans-serif; }

  /* Sélecteur segmenté Meta / Situationnels / Tous */
  .seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 9px; padding: 3px; gap: 3px; }
  .segbtn { background: transparent; border: none; color: var(--muted); cursor: pointer;
    border-radius: 7px; padding: 6px 13px; font-family: "Rajdhani", sans-serif; font-size: 12px;
    font-weight: 700; text-transform: uppercase; letter-spacing: .6px; transition: .14s; white-space: nowrap; }
  .segbtn:hover { color: var(--txt); }
  .segbtn.on { background: linear-gradient(135deg, var(--gold), #ffe38a); color: #17140a;
    box-shadow: 0 0 14px rgba(255,207,63,.35); }

  /* Sélecteurs multi-choix */
  .dropdown { position: relative; }
  .ddbtn { background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 8px; padding: 7px 13px; font-family: "Rajdhani", sans-serif; font-size: 13px;
    font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: .6px;
    display: inline-flex; align-items: center; gap: 7px; transition: .14s; }
  .ddbtn:hover { border-color: var(--cyan); box-shadow: 0 0 12px rgba(51,230,255,.2); }
  .ddbtn.ghost { color: var(--muted); }
  .ddbtn .ddcount { color: var(--gold); font-family: "Orbitron", sans-serif; font-size: 11px; }
  .ddbtn .caret { font-style: normal; color: var(--muted); font-size: 11px; }
  .dropdown.open .ddbtn { border-color: var(--cyan); color: var(--cyan); }
  .dropdown.open .caret { transform: rotate(180deg); }
  .ddpanel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 200px;
    background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px; display: none; max-height: 340px; overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,.6), 0 0 20px rgba(51,230,255,.12); }
  .dropdown.open .ddpanel { display: block; }
  .ddopt { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 7px;
    cursor: pointer; font-size: 14px; font-weight: 600; user-select: none; transition: .12s; }
  .ddopt:hover { background: var(--panel2); }
  .ddopt input { appearance: none; width: 16px; height: 16px; border: 1px solid var(--line);
    border-radius: 4px; cursor: pointer; position: relative; flex: none; }
  .ddopt input:checked { background: var(--gold); border-color: var(--gold); }
  .ddopt input:checked::after { content: "✓"; position: absolute; inset: 0; color: #17140a;
    font-size: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
  .ddopt .flag { font-size: 16px; }
  .tsvg { width: 14px; height: 14px; fill: currentColor; vertical-align: -2px; flex: none; }
  .ddopt .tsvg { width: 16px; height: 16px; color: var(--cyan); }
  .badge .tsvg { width: 12px; height: 12px; }

  .grid { max-width: 1240px; margin: 22px auto 70px; padding: 0 16px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
  .card {
    position: relative; overflow: hidden; cursor: pointer; min-height: 186px;
    transform-style: preserve-3d;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 12px;
    background: linear-gradient(180deg, rgba(24,32,52,.9), rgba(10,14,26,.95));
    border: 1px solid var(--line); border-radius: 4px;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    transition: transform .16s, box-shadow .16s, border-color .16s;
    animation: pop .35s ease both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .card::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 4px; pointer-events: none;
    background: linear-gradient(135deg, transparent 40%, rgba(51,230,255,.5), transparent 70%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: .16s;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--cyan);
    box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 26px rgba(51,230,255,.28); }
  .card:hover::before { opacity: 1; }
  .card .bg { position: absolute; inset: 0; background-repeat: no-repeat;
    background-position: center 34%; background-size: 138%; opacity: .96;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,.7)); transition: transform .2s; }
  .card:hover .bg { transform: scale(1.09); }
  .card::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(5,7,15,0) 42%, rgba(5,7,15,.6) 70%, rgba(5,7,15,.96) 100%); }
  .card .nm, .card .badges, .card .dot, .card .tier { position: relative; z-index: 1; }
  .card .metatag { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); z-index: 1;
    font-family: "Orbitron", sans-serif; font-size: 9px; font-weight: 900; letter-spacing: 1px;
    color: #17140a; background: linear-gradient(135deg, var(--gold), #ffe38a); padding: 2px 8px;
    border-radius: 6px; box-shadow: 0 0 12px rgba(255,207,63,.5); }
  .card .tier { position: absolute; top: 10px; left: 10px; font-family: "Orbitron", sans-serif;
    font-weight: 900; font-size: 12px; color: var(--gold); letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(255,207,63,.6); z-index: 1; }
  /* liseré coloré par type (gauche) */
  .card .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; z-index: 1;
    background: var(--tc, var(--line)); box-shadow: 0 0 12px var(--tc, transparent); }
  /* anneau de complétion du build */
  .card .ring { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; z-index: 1;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: conic-gradient(var(--green) calc(var(--p, 0) * 1%), rgba(180,200,255,.14) 0); }
  .card .ring::after { content: ""; position: absolute; inset: 4px; border-radius: 50%;
    background: #0c1120; }
  .card .ring b { position: relative; font-family: "Orbitron", sans-serif; font-size: 8px;
    font-weight: 900; color: var(--green); }
  .card .nm { font-family: "Orbitron", sans-serif; font-size: 14px; font-weight: 700; text-align: center;
    letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 2px 8px rgba(0,0,0,.95); }
  .card .badges { display: flex; gap: 5px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 0 9px; height: 22px; line-height: 1; border-radius: 6px;
    background: rgba(40,52,80,.7); color: #b9c6ee; border: 1px solid var(--line); font-weight: 700;
    letter-spacing: .5px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; }
  .badge.prem { color: var(--gold); border-color: rgba(255,207,63,.4); background: rgba(60,48,10,.6);
    box-shadow: 0 0 10px rgba(255,207,63,.25); }
  .card .dot { position: absolute; top: 10px; right: 10px; width: 9px; height: 9px; border-radius: 50%;
    background: #33405f; }
  .card .dot.ok { background: var(--green); box-shadow: 0 0 12px var(--green);
    animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 50px; font-size: 16px; }

  /* Modale */
  .backdrop { position: fixed; inset: 0; background: rgba(3,5,12,.82); backdrop-filter: blur(4px);
    display: none; align-items: flex-start; justify-content: center; padding: 34px 16px; z-index: 50; overflow-y: auto; }
  .backdrop.open { display: flex; }
  .modal { position: relative; max-width: 840px; width: 100%;
    background: linear-gradient(180deg, rgba(18,24,42,.96), rgba(9,13,24,.98)); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 6px;
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
    box-shadow: 0 30px 90px rgba(0,0,0,.7), 0 0 40px rgba(51,230,255,.14);
    animation: modalin .22s ease both; }
  @keyframes modalin { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  .modal .top { display: flex; gap: 16px; align-items: center; padding: 20px 22px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(51,230,255,.06), transparent); }
  .modal .top img { height: 68px; object-fit: contain; filter: drop-shadow(0 4px 14px rgba(51,230,255,.35)); }
  .modal .top .h { flex: 1; }
  .modal .top h2 { margin: 0; font-family: "Orbitron", sans-serif; font-weight: 900; font-size: 22px;
    letter-spacing: 1px; }
  .modal .top .badges { margin-top: 7px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .modal .close { background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--muted);
    font-size: 20px; cursor: pointer; line-height: 1; width: 34px; height: 34px; transition: .14s; }
  .modal .close:hover { color: var(--red); border-color: var(--red); box-shadow: 0 0 14px rgba(255,93,108,.3); }
  .role { color: var(--cyan); font-size: 13px; margin-top: 6px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; text-shadow: 0 0 12px rgba(51,230,255,.4); }
  .body { padding: 16px 22px 22px; }
  .section { margin-top: 16px; }
  .section h3 { font-family: "Orbitron", sans-serif; font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--cyan); margin: 0 0 10px; }

  /* Onglets */
  .tabbar { display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line);
    padding-bottom: 14px; margin-bottom: 16px; }
  .tab { background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 9px 16px; font-family: "Rajdhani", sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; text-transform: uppercase; letter-spacing: .8px; transition: .14s; }
  .tab:hover { color: var(--txt); border-color: var(--cyan); box-shadow: 0 0 12px rgba(51,230,255,.2); }
  .tab.on { background: linear-gradient(135deg, var(--gold), #ffe38a); color: #17140a; border-color: var(--gold);
    box-shadow: 0 0 18px rgba(255,207,63,.4); }
  .tabpanel { display: none; animation: fade .2s ease both; }
  .tabpanel.on { display: block; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .crewrole { margin-bottom: 14px; }
  .crolehdr { font-family: "Orbitron", sans-serif; font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--cyan); margin-bottom: 7px; }
  .setup-label { font-family: "Orbitron", sans-serif; font-size: 12px; color: var(--gold); font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; margin: 12px 0 8px; }
  .slots { display: flex; flex-wrap: wrap; gap: 9px; }
  .slot { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 13px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; }
  .slot.num::before { content: attr(data-n); color: var(--gold); margin-right: 9px; font-weight: 900;
    font-family: "Orbitron", sans-serif; font-size: 12px; }
  .slot .eqic { width: 26px; height: 26px; object-fit: contain; margin: 0 9px 0 2px;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,.7)); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 13px; font-size: 14px; font-weight: 600; }
  .ammo { font-family: "Orbitron", sans-serif; font-size: 16px; font-weight: 700; color: var(--gold);
    letter-spacing: 1px; }
  .note { background: linear-gradient(90deg, rgba(51,230,255,.08), transparent);
    border-left: 3px solid var(--cyan); border-radius: 6px; padding: 12px 15px; font-size: 15px; white-space: pre-wrap; }
  .todo { color: var(--muted); font-style: italic; padding: 12px 0; font-size: 16px; }
  .armor { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 11px 16px;
    font-size: 14px; font-weight: 700; color: var(--txt); letter-spacing: .5px; transition: .14s; }
  .armor:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 16px rgba(51,230,255,.25); }

  /* Arbre des directives */
  .fmtree { display: flex; flex-direction: column; gap: 15px; }
  .fmrow2 { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; }
  .fmlvl { width: 34px; height: 34px; border-radius: 50%; font-family: "Orbitron", sans-serif;
    background: linear-gradient(135deg, var(--gold), #ffe38a); color: #17140a; font-weight: 900; font-size: 13px;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 16px rgba(255,207,63,.45); }
  .fmlvl.empty { background: transparent; box-shadow: none; }
  .fmopts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fmcard { position: relative; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 13px 11px; text-align: center; font-size: 14px; font-weight: 600; color: var(--muted);
    min-height: 54px; display: flex; align-items: center; justify-content: center; transition: .14s; }
  .fmcard.picked { border-color: var(--gold); color: var(--txt);
    background: linear-gradient(180deg, rgba(255,207,63,.16), rgba(255,207,63,.05));
    box-shadow: 0 0 20px rgba(255,207,63,.28); }
  .fmcard .chk { position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, var(--gold), #ffe38a); color: #17140a; width: 22px; height: 22px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-style: normal;
    box-shadow: 0 0 12px rgba(255,207,63,.5); }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 26px; letter-spacing: .5px; }

  @media (max-width: 560px) {
    header h1 { font-size: 22px; letter-spacing: 1.5px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<header>
  <h1><b>Index Compétitif</b> - Tier X</h1>
  <div class="sub">Équipements, directives, équipage et consommables pour le jeu en équipe (World of Tanks)</div>
  <div class="by">par <b>SEBonduel</b></div>
  <div class="stats" id="stats">
    <div class="stat"><b data-c="chars">0</b><span>Chars</span></div>
    <div class="statsep"></div>
    <div class="stat"><b data-c="meta">0</b><span>Meta</span></div>
    <div class="statsep"></div>
    <div class="stat"><b data-c="builds">0</b><span>Builds</span></div>
  </div>
</header>

<div class="toolbar">
  <input type="text" id="search" class="search" placeholder="Rechercher un char par nom…" autocomplete="off">
  <div class="filters">
    <div class="seg" id="listSeg">
      <button class="segbtn on" data-m="all">Tous</button>
      <button class="segbtn" data-m="meta">★ Chars meta</button>
      <button class="segbtn" data-m="situ">Situationnels</button>
    </div>
    <div class="sep"></div>
    <div class="dropdown" id="ddNation">
      <button class="ddbtn" id="ddNationBtn"><span>Nations</span> <b class="ddcount"></b><i class="caret">▾</i></button>
      <div class="ddpanel" id="ddNationPanel"></div>
    </div>
    <div class="dropdown" id="ddType">
      <button class="ddbtn" id="ddTypeBtn"><span>Types</span> <b class="ddcount"></b><i class="caret">▾</i></button>
      <div class="ddpanel" id="ddTypePanel"></div>
    </div>
    <div class="pill" id="onlyBuilds">✓ Avec build</div>
    <button class="ddbtn ghost" id="resetFilters">Réinitialiser</button>
    <div class="count" id="count"></div>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="backdrop" id="backdrop">
  <div class="modal" id="modal"></div>
</div>

<footer>Données chars : API Wargaming · Builds : SEBonduel · non affilié à Wargaming.net</footer>

<script>
"use strict";
(function () {
  const el = (id) => document.getElementById(id);
  const state = { tanks: [], builds: {}, equipment: [], crewskills: [], meta: new Set(),
                  listMode: "all", nations: [], types: [], q: "", onlyBuilds: false };

  const TYPE_ORDER = ["heavyTank", "mediumTank", "lightTank", "AT-SPG", "SPG"];
  const TYPE_FR = { heavyTank: "Lourd", mediumTank: "Moyen", lightTank: "Léger",
                    "AT-SPG": "Chasseur", SPG: "Arty" };
  // Noms complets pour le sélecteur (les cartes gardent la version courte nation_fr).
  const NATION_FULL = { ussr: "U.R.S.S.", germany: "Allemagne", usa: "États-Unis",
    france: "France", uk: "Royaume-Uni", china: "Chine", japan: "Japon",
    czech: "Tchécoslovaquie", poland: "Pologne", sweden: "Suède", italy: "Italie" };
  // Icônes de type façon jeu (SVG géométriques, héritent de la couleur du texte).
  const sv = (inner) => `<svg class="tsvg" viewBox="0 0 16 16" aria-hidden="true">${inner}</svg>`;
  const TYPE_SVG = {
    heavyTank: sv(`<rect x="3" y="3" width="10" height="10" rx="2"/>`),
    mediumTank: sv(`<path d="M8 1.5 L14.5 8 L8 14.5 L1.5 8 Z"/>`),
    lightTank: sv(`<path d="M8 1.8 L14.2 8 L8 14.2 L1.8 8 Z" fill="none" stroke="currentColor" stroke-width="2"/>`),
    "AT-SPG": sv(`<path d="M8 2 L14.5 13.5 L1.5 13.5 Z"/>`),
    SPG: sv(`<path d="M1.5 12.5 A6.5 6.5 0 0 1 14.5 12.5 Z"/>`),
  };
  const FLAG = { ussr: "🇷🇺", germany: "🇩🇪", usa: "🇺🇸", france: "🇫🇷", uk: "🇬🇧",
                 china: "🇨🇳", japan: "🇯🇵", czech: "🇨🇿", poland: "🇵🇱", sweden: "🇸🇪", italy: "🇮🇹" };
  const TYPE_COLOR = { heavyTank: "#ff5d6c", mediumTank: "#38ffb0", lightTank: "#33e6ff",
                       "AT-SPG": "#9b7bff", SPG: "#ffcf3f" };

  const norm = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  // Clé de recherche : sans accents, ni espaces/tirets/points (is-7 = is7 = is 7).
  const sk = (s) => norm(s).replace(/[^a-z0-9]/g, "");

  // equipment accepte : 3 chaînes à plat OU [{label, slots[3]}] (1 ou 2 compos).
  function equipSetups(equipment) {
    if (!equipment || !equipment.length) return [];
    if (typeof equipment[0] === "string") {
      return equipment.some(Boolean) ? [{ label: "", slots: equipment.filter(Boolean) }] : [];
    }
    return equipment
      .filter((s) => s && (s.slots || []).some(Boolean))
      .map((s) => ({ label: s.label || "", slots: (s.slots || []).filter(Boolean) }));
  }
  const hasBuild = (slug) => buildPct(slug) > 0;
  // % de complétion d'un build (6 sections possibles).
  function buildPct(slug) {
    const b = state.builds[slug];
    if (!b) return 0;
    let f = 0;
    if (equipSetups(b.equipment).length) f++;
    if (b.fieldModsTree?.length || b.fieldMods?.length) f++;
    if (b.crew?.length) f++;
    if (b.consumables?.length) f++;
    if (b.ammo) f++;
    if (b.note) f++;
    return Math.round((f / 6) * 100);
  }

  // Construit un menu déroulant multi-choix (cases à cocher) dans `panel`.
  function fillDropdown(panel, options, arr) {
    panel.innerHTML = "";
    options.forEach((o) => {
      const lab = document.createElement("label");
      lab.className = "ddopt";
      lab.innerHTML = `<input type="checkbox">${o.iconHtml || ""}${o.label}`;
      const cb = lab.querySelector("input");
      cb.checked = arr.includes(o.value);
      cb.onchange = () => {
        const i = arr.indexOf(o.value);
        if (cb.checked && i < 0) arr.push(o.value);
        else if (!cb.checked && i >= 0) arr.splice(i, 1);
        sync();
      };
      panel.appendChild(lab);
    });
  }

  function buildFilters() {
    const nations = [...new Set(state.tanks.map((t) => t.nation))]
      .sort((a, b) => (NATION_FULL[a] || a).localeCompare(NATION_FULL[b] || b));
    fillDropdown(el("ddNationPanel"),
      nations.map((n) => ({ value: n, label: NATION_FULL[n] || n,
        iconHtml: `<span class="flag">${FLAG[n] || ""}</span>` })),
      state.nations);
    const types = TYPE_ORDER.filter((ty) => state.tanks.some((t) => t.type === ty));
    fillDropdown(el("ddTypePanel"),
      types.map((ty) => ({ value: ty, label: TYPE_FR[ty] })),
      state.types);

    // Ouverture/fermeture des menus.
    [["ddNationBtn", "ddNation"], ["ddTypeBtn", "ddType"]].forEach(([btn, dd]) => {
      el(btn).onclick = (e) => {
        e.stopPropagation();
        const open = el(dd).classList.contains("open");
        document.querySelectorAll(".dropdown").forEach((d) => d.classList.remove("open"));
        el(dd).classList.toggle("open", !open);
      };
    });
    document.addEventListener("click", () =>
      document.querySelectorAll(".dropdown").forEach((d) => d.classList.remove("open")));
    el("ddNationPanel").onclick = (e) => e.stopPropagation();
    el("ddTypePanel").onclick = (e) => e.stopPropagation();
    el("resetFilters").onclick = () => {
      state.nations = []; state.types = []; state.onlyBuilds = false;
      document.querySelectorAll(".ddpanel input").forEach((cb) => { cb.checked = false; });
      sync();
    };
    // Sélecteur segmenté Meta / Situationnels / Tous.
    document.querySelectorAll("#listSeg .segbtn").forEach((btn) => {
      btn.onclick = () => {
        state.listMode = btn.dataset.m;
        document.querySelectorAll("#listSeg .segbtn").forEach((x) => x.classList.toggle("on", x === btn));
        render();
      };
    });
  }

  function sync() {
    const nc = el("ddNation").querySelector(".ddcount");
    const tc = el("ddType").querySelector(".ddcount");
    nc.textContent = state.nations.length ? `(${state.nations.length})` : "";
    tc.textContent = state.types.length ? `(${state.types.length})` : "";
    el("onlyBuilds").classList.toggle("on", state.onlyBuilds);
    render();
  }

  function render() {
    const q = sk(state.q);
    const list = state.tanks.filter((t) =>
      (state.listMode === "all" ||
        (state.listMode === "meta" ? state.meta.has(t.slug) : !state.meta.has(t.slug))) &&
      (!state.nations.length || state.nations.includes(t.nation)) &&
      (!state.types.length || state.types.includes(t.type)) &&
      (!state.onlyBuilds || hasBuild(t.slug)) &&
      (!q || sk(t.name).includes(q) || sk(t.slug).includes(q)));
    const g = el("grid");
    g.innerHTML = "";
    el("count").textContent = `${list.length} char${list.length > 1 ? "s" : ""}`;
    if (!list.length) { g.innerHTML = '<div class="empty">Aucun char pour ces filtres.</div>'; return; }
    list.forEach((t, i) => {
      const c = document.createElement("div");
      c.className = "card";
      c.style.setProperty("--tc", TYPE_COLOR[t.type] || "var(--line)");
      c.style.animationDelay = Math.min(i * 18, 360) + "ms";
      const pct = buildPct(t.slug);
      const ind = pct > 0
        ? `<div class="ring" style="--p:${pct}"><b>${pct}</b></div>`
        : `<div class="dot"></div>`;
      c.innerHTML =
        `<div class="bg" style="background-image:url('${t.icon}')"></div>` +
        `<div class="stripe"></div>` +
        `<div class="tier">X</div>` +
        (state.listMode === "all" && state.meta.has(t.slug) ? `<div class="metatag">★ META</div>` : "") +
        ind +
        `<div class="nm">${t.name}</div>` +
        `<div class="badges"><span class="badge">${FLAG[t.nation] || ""} ${t.nation_fr}</span>` +
        `<span class="badge">${TYPE_FR[t.type] || t.type_fr}</span>` +
        (t.premium ? `<span class="badge prem">★ Prem</span>` : "") + `</div>`;
      c.onclick = () => openModal(t);
      g.appendChild(c);
    });
  }

  function slots(arr) {
    return `<div class="slots">` + arr.map((s, i) =>
      `<div class="slot num" data-n="${i + 1}">${s}</div>`).join("") + `</div>`;
  }
  // Résout l'icône d'un équipement à partir du texte du slot (nom ou alias).
  function equipIcon(text) {
    const t = norm(text);
    let best = null, len = 0;
    for (const e of state.equipment) {
      for (const a of [e.name, ...(e.aliases || [])]) {
        const na = norm(a);
        if (na && t.includes(na) && na.length > len) { best = e.icon; len = na.length; }
      }
    }
    return best;
  }
  function equipSlots(arr) {
    return `<div class="slots">` + arr.map((s, i) => {
      const ic = equipIcon(s);
      return `<div class="slot num eq" data-n="${i + 1}">` +
        (ic ? `<img class="eqic" src="${ic}" alt="">` : "") + s + `</div>`;
    }).join("") + `</div>`;
  }
  // Résout l'icône d'une compétence d'équipage (nom ou alias).
  function crewIcon(text) {
    const t = norm(text);
    let best = null, len = 0;
    for (const c of state.crewskills) {
      for (const a of [c.name, ...(c.aliases || [])]) {
        const na = norm(a);
        if (na && (t.includes(na) || na.includes(t)) && na.length > len) { best = c.icon; len = na.length; }
      }
    }
    return best;
  }
  function crewSlots(arr) {
    return `<div class="slots">` + arr.map((s, i) => {
      const ic = crewIcon(s);
      return `<div class="slot num eq" data-n="${i + 1}">` +
        (ic ? `<img class="eqic" src="${ic}" alt="">` : "") + s + `</div>`;
    }).join("") + `</div>`;
  }
  // crew : liste plate OU par membre [{role, skills[]}] (façon garage/skill4ltu).
  function crewRender(crew) {
    if (!crew || !crew.length) return "";
    if (typeof crew[0] === "object")
      return crew.map((r) =>
        `<div class="crewrole"><div class="crolehdr">${r.role || ""}</div>${crewSlots(r.skills || [])}</div>`
      ).join("");
    return crewSlots(crew);
  }
  function chips(arr) {
    return `<div class="chips">` + arr.map((s) => `<span class="chip">${s}</span>`).join("") + `</div>`;
  }
  // Arbre des directives : chaque ligne = 2 options, le côté "pick" est surligné.
  function fmTree(rows) {
    const opt = (r, side) => {
      const picked = r.pick === side;
      const label = side === "left" ? r.left : r.right;
      return `<div class="fmcard ${picked ? "picked" : ""}"><span>${label || ""}</span>` +
        (picked ? `<i class="chk">✓</i>` : "") + `</div>`;
    };
    return `<div class="fmtree">` + rows.map((r) =>
      `<div class="fmrow2">` +
      `<div class="fmlvl ${r.level ? "" : "empty"}">${r.level || ""}</div>` +
      `<div class="fmopts">${opt(r, "left")}${opt(r, "right")}</div></div>`
    ).join("") + `</div>`;
  }

  function openModal(t) {
    const b = state.builds[t.slug] || {};
    const armor = `https://tanks.gg/tank/${t.slug}/model`;

    const head =
      `<div class="top">` +
      `<img src="${t.icon}" alt="${t.name}">` +
      `<div class="h"><h2>${t.name}</h2>` +
      `<div class="badges"><span class="badge">${FLAG[t.nation] || ""} ${t.nation_fr}</span>` +
      `<span class="badge">${t.type_fr}</span>` +
      `<span class="badge">Tier X</span>` +
      (t.premium ? `<span class="badge prem">★ Premium</span>` : "") + `</div>` +
      (b.role ? `<div class="role">▲ ${b.role}</div>` : "") +
      `</div><button class="close" title="Fermer">×</button></div>`;

    // Onglets : uniquement ceux qui ont du contenu.
    const tabs = [];
    const setups = equipSetups(b.equipment);
    if (setups.length || b.consumables?.length || b.ammo) {
      const multi = setups.length > 1;
      let c = "";
      if (setups.length)
        c += setups.map((s) =>
          (multi || s.label ? `<div class="setup-label">${s.label || "Compo"}</div>` : "") +
          equipSlots(s.slots)).join("");
      if (b.consumables?.length)
        c += `<div class="section"><h3>Consommables</h3>${chips(b.consumables)}</div>`;
      if (b.ammo)
        c += `<div class="section"><h3>Obus</h3><div class="ammo">${b.ammo}</div></div>`;
      tabs.push({ k: "equip", label: "Équipements", html: c });
    }
    if (b.fieldModsTree?.length)
      tabs.push({ k: "fm", label: "Amélioration de terrain", html: fmTree(b.fieldModsTree) });
    else if (b.fieldMods?.length)
      tabs.push({ k: "fm", label: "Amélioration de terrain", html: chips(b.fieldMods) });
    if (b.crew?.length)
      tabs.push({ k: "crew", label: "Équipage", html: crewRender(b.crew) });
    if (b.note)
      tabs.push({ k: "note", label: "Note", html: `<div class="note">${b.note}</div>` });

    let body;
    if (!tabs.length) {
      body = `<div class="todo">Build compétitif à venir pour ce char.</div>`;
    } else {
      const bar = tabs.map((tb, i) =>
        `<button class="tab ${i === 0 ? "on" : ""}" data-k="${tb.k}">${tb.label}</button>`).join("");
      const panels = tabs.map((tb, i) =>
        `<div class="tabpanel ${i === 0 ? "on" : ""}" data-k="${tb.k}">${tb.html}</div>`).join("");
      body = `<div class="tabbar">${bar}</div><div class="tabpanels">${panels}</div>`;
    }

    const html = head + `<div class="body">` + body +
      `<a class="armor" href="${armor}" target="_blank" rel="noopener">Voir le blindage 3D sur tanks.gg ↗</a></div>`;

    el("modal").innerHTML = html;
    el("modal").querySelectorAll(".tab").forEach((btn) => {
      btn.onclick = () => {
        el("modal").querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === btn));
        el("modal").querySelectorAll(".tabpanel").forEach((p) =>
          p.classList.toggle("on", p.dataset.k === btn.dataset.k));
      };
    });
    el("modal").querySelector(".close").onclick = closeModal;
    el("backdrop").classList.add("open");
  }
  function closeModal() { el("backdrop").classList.remove("open"); }

  el("search").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  el("onlyBuilds").addEventListener("click", () => { state.onlyBuilds = !state.onlyBuilds; sync(); });
  el("backdrop").addEventListener("click", (e) => { if (e.target === el("backdrop")) closeModal(); });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  // Tilt 3D des cartes au survol (délégation sur la grille).
  let tilted = null;
  const gridEl = el("grid");
  gridEl.addEventListener("pointermove", (e) => {
    const card = e.target.closest(".card");
    if (tilted && tilted !== card) tilted.style.transform = "";
    if (!card) { tilted = null; return; }
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    card.style.transform =
      `translateY(-4px) perspective(700px) rotateX(${-py * 6}deg) rotateY(${px * 6}deg)`;
    tilted = card;
  });
  gridEl.addEventListener("pointerleave", () => {
    if (tilted) { tilted.style.transform = ""; tilted = null; }
  });

  // Compteurs animés (count-up) du header.
  function countUp(node, target) {
    if (!node) return;
    const dur = 900, t0 = performance.now();
    const step = (t) => {
      const p = Math.min((t - t0) / dur, 1);
      node.textContent = Math.round((1 - Math.pow(1 - p, 3)) * target);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  Promise.all([
    fetch("data/tanks.json").then((r) => r.json()),
    fetch("data/builds.json").then((r) => r.json()).catch(() => ({})),
    fetch("data/equipment.json").then((r) => r.json()).catch(() => ([])),
    fetch("data/crewskills.json").then((r) => r.json()).catch(() => ([])),
    fetch("data/meta.json").then((r) => r.json()).catch(() => ([])),
  ]).then(([tanks, builds, equipment, crewskills, meta]) => {
    state.tanks = tanks;
    delete builds._schema;
    state.builds = builds;
    state.equipment = equipment;
    state.crewskills = crewskills;
    state.meta = new Set(meta);
    buildFilters();
    render();
    countUp(document.querySelector('[data-c="chars"]'), tanks.length);
    countUp(document.querySelector('[data-c="meta"]'), state.meta.size);
    countUp(document.querySelector('[data-c="builds"]'),
      tanks.filter((t) => hasBuild(t.slug)).length);
  });
})();
</script>
</body>
</html>
